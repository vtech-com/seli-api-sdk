name: Release

# Two entry points. The usual one is release-on-merge.yml, which tags the merge
# of a release/vX.Y.Z PR into main and then calls this workflow through
# workflow_call, supplying inputs.tag: a tag pushed with GITHUB_TOKEN does not
# fire `push` workflows, so that path cannot rely on the tag trigger below.
# The tag trigger stays for a tag pushed by hand.
#
# release-on-merge.yml is not in this branch. It lands separately, on the branch
# docs/agent-guides-release-flow, so until that merges nothing calls
# workflow_call here and only the tag trigger is live.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser release
    runs-on: ubuntu-latest

    steps:
      # The API host is configuration, never code: the binary's fallback host is
      # injected at build time from this repository variable. A release without
      # one would ship a binary that cannot reach anything until the user sets
      # SELI_API_URL, so stop before building rather than after publishing.
      - name: Require the default API URL
        env:
          SELI_DEFAULT_API_URL: ${{ vars.SELI_DEFAULT_API_URL }}
        run: |
          if [ -z "$SELI_DEFAULT_API_URL" ]; then
            echo "::error::repository variable SELI_DEFAULT_API_URL is not set; set it (Settings > Secrets and variables > Actions > Variables) to the API base URL, https://<host> with no path, and re-run"
            exit 1
          fi
          case "$SELI_DEFAULT_API_URL" in
            https://*) ;;
            *)
              echo "::error::repository variable SELI_DEFAULT_API_URL must start with https://"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      # Whoever can push a tag can otherwise publish any commit. Only a commit
      # already on main -- which a human approved into it -- may be released,
      # and its CHANGELOG must carry the section the tag names.
      - name: Check the tag is releasable
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points at $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi
          if ! grep -qF "## [${TAG#v}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md at $TAG has no '## [${TAG#v}]' section"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned to a minor line: patch releases are picked up automatically,
          # a minor bump is not, so an unreviewed minor bump cannot silently
          # change what the release publishes.
          version: "~> v2.18"
          install-only: true

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELI_DEFAULT_API_URL: ${{ vars.SELI_DEFAULT_API_URL }}
