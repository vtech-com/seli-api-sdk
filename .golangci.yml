version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosec

  settings:
    gosec:
      excludes:
        - G304 # file inclusion via variable - controlled paths only

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt

  settings:
    gofmt:
      simplify: true
