version: 2

project_name: seli

builds:
  - id: seli
    binary: seli
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/vtech-com/seli-api-sdk/internal/version.Version={{.Version}}
      - -X github.com/vtech-com/seli-api-sdk/internal/version.Commit={{.Commit}}
      - -X github.com/vtech-com/seli-api-sdk/internal/version.Date={{.Date}}
      # The API host is configuration, never code: it comes from the environment
      # (release.yml passes the repository variable SELI_DEFAULT_API_URL and fails
      # before building if it is empty). envOrDefault lets a local
      # `make release-snapshot` build without it, yielding a binary that needs
      # --api-url or SELI_API_URL at runtime.
      - -X github.com/vtech-com/seli-api-sdk/internal/version.DefaultAPIURL={{ envOrDefault "SELI_DEFAULT_API_URL" "" }}

archives:
  - id: seli
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

nfpms:
  - id: seli
    ids:
      - seli
    package_name: seli
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
    vendor: VTech
    # Contacts are configuration, like the API host: the domain will change, so
    # release.yml supplies them from repository variables. The fallbacks name no
    # domain at all.
    homepage: '{{ envOrDefault "SELI_HOMEPAGE" "https://github.com/vtech-com/seli-api-sdk" }}'
    maintainer: '{{ envOrDefault "SELI_MAINTAINER" "VTech <https://github.com/vtech-com/seli-api-sdk>" }}'
    description: "CLI tool and Go SDK for the Seli platform"
    license: MIT
    bindir: /usr/bin
    section: utils
    priority: optional

# Published to the same tap as capigo: brew install --cask vtech-com/tap/seli.
# Casks are macOS-only; Linux uses scripts/install.sh or the .deb above.
homebrew_casks:
  - name: seli
    repository:
      owner: vtech-com
      name: homebrew-tap
      # Must be exactly {{ .Env.NAME }}: GoReleaser renders a repository token
      # with an env-only template that has no functions (envOrDefault fails the
      # publish). release.yml always exports TAP_GITHUB_TOKEN, empty when the
      # secret is unset, and an empty token never gets here: skip_upload below
      # returns before the token is read. release_config_test.go guards this.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # Without a token the cask is still rendered into dist/ but not pushed, so a
    # missing secret costs the Homebrew channel, not the whole release. capigo's
    # config has no such guard: there, a missing token turns a release that has
    # already published its GitHub assets red. release.yml warns when it is unset.
    skip_upload: '{{ if eq (envOrDefault "TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    homepage: '{{ envOrDefault "SELI_HOMEPAGE" "https://github.com/vtech-com/seli-api-sdk" }}'
    description: "CLI tool and Go SDK for the Seli platform"
    binaries: ["seli"]
    # The binaries are not signed or notarized, so Gatekeeper would refuse to run
    # one carrying the quarantine attribute. Same trade-off as capigo; signing and
    # notarization would remove the need for it.
    hooks:
      post:
        install: 'system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/seli"]'

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
